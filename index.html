<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #ff6b6b, #5f27cd);
        color: white;
        text-align: center;
        padding: 20px;
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    h1 {
        margin-top: 0;
        margin-bottom: 20px;
    }

    /* 1. SELECTION SCREEN STYLES */
    #selection-screen {
        background: rgba(0, 0, 0, 0.4);
        padding: 30px;
        border-radius: 15px;
        max-width: 400px;
        width: 100%;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        max-height: 90vh;
        overflow-y: auto;
    }

    select, input[type="text"] {
        padding: 12px;
        font-size: 16px;
        border-radius: 8px;
        border: none;
        background-color: #ffffff;
        color: #333;
        margin: 8px 0;
        width: 100%;
        outline: none;
        font-weight: bold;
    }

    .names-container {
        margin: 15px 0;
        max-height: 200px;
        overflow-y: auto;
        padding-right: 5px;
    }

    /* 2. GAME SCREEN STYLES */
    #game-screen {
        display: none; /* Initially hidden */
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 450px;
    }

    /* Wheel Spinner Container */
    .spinner-container {
        position: relative;
        width: 300px;
        height: 300px;
        margin: 20px 0;
        cursor: pointer;
    }

    .arrow {
        position: absolute;
        top: -15px;
        left: 50%;
        transform: translateX(-50%);
        width: 0; 
        height: 0;
        border-left: 15px solid transparent;
        border-right: 15px solid transparent;
        border-top: 25px solid #ffe66d;
        z-index: 10;
        filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.5));
    }

    .wheel {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 5px solid #fff;
        position: relative;
        overflow: hidden;
        transition: transform 4s cubic-bezier(0.15, 0.85, 0.35, 1);
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
    }

    .number {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 60px;
        height: 40px;
        margin-top: -20px;
        margin-left: -30px;
        font-size: 14px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .center-circle {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 45px;
        height: 45px;
        background: #fff;
        color: #333;
        font-weight: bold;
        font-size: 12px;
        border-radius: 50%;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    /* Truth & Dare Box Styles */
    .box {
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(5px);
        padding: 20px;
        border-radius: 15px;
        width: 100%;
        margin-top: 10px;
        border: 1px solid rgba(255,255,255,0.2);
    }

    /* Buttons */
    button {
        margin: 8px;
        padding: 12px 24px;
        border: none;
        border-radius: 25px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        color: white;
        transition: transform 0.2s, background-color 0.2s;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    button:hover {
        transform: scale(1.05);
    }

    button:disabled {
        background: #7f8c8d !important;
        cursor: not-allowed;
        transform: scale(1);
    }

    .start-btn {
        background: #1dd1a1;
        width: 100%;
        margin: 10px 0 0 0;
    }

    .spin-btn {
        background: #ff4757;
        font-size: 18px;
        padding: 12px 35px;
    }

    .truth {
        background: #00d2d3;
    }

    .dare {
        background: #ff9f43;
    }

    .reset-btn {
        background: rgba(255,255,255,0.2);
        font-size: 13px;
        padding: 6px 15px;
        margin-top: 15px;
    }

    /* Bottom-Right Winner Button */
    .winner-btn {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: #f1c40f;
        color: #2c3e50;
        font-size: 14px;
        padding: 12px 20px;
        border-radius: 30px;
        font-weight: bold;
        box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        z-index: 100;
    }

    #turn-info {
        font-size: 20px;
        font-weight: bold;
        color: #ffe66d;
        min-height: 28px;
        margin-top: 10px;
    }

    #result {
        margin-top: 15px;
        font-size: 18px;
        font-weight: bold;
        min-height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* 3. WINNER SCREEN OVERLAY & FIREWORKS STYLES */
    #winner-screen {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(10, 10, 20, 0.95);
        z-index: 999;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: white;
    }

    #canvas-fireworks {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1000;
    }

    .winner-content {
        position: relative;
        z-index: 1001;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        padding: 30px;
        border-radius: 20px;
        border: 2px solid #f1c40f;
        max-width: 400px;
        width: 90%;
        box-shadow: 0 0 30px rgba(241, 196, 15, 0.5);
    }

    .winner-title {
        font-size: 32px;
        color: #f1c40f;
        margin-bottom: 10px;
        animation: pulse 1.5s infinite alternate;
    }

    .winner-details {
        font-size: 20px;
        margin: 15px 0;
        line-height: 1.5;
    }

    .stats-table {
        margin-top: 15px;
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
    }

    .stats-table th, .stats-table td {
        padding: 8px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }

    .action-btn-group {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-top: 20px;
    }

    .back-btn {
        background: #54a0ff;
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        100% { transform: scale(1.08); }
    }
</style>
</head>

<body>

  <!-- STEP 1: PLAYER SELECTION SCREEN -->
  <div id="selection-screen">
    <h1>😈 Truth or Dare</h1>
    <h3 style="margin-bottom: 5px;">Select Total Players</h3>
    <select id="playerSelect" onchange="generateNameInputs()">
      <option value="1">1 Player</option>
      <option value="2">2 Players</option>
      <option value="3">3 Players</option>
      <option value="4">4 Players</option>
      <option value="5">5 Players</option>
      <option value="6" selected>6 Players</option>
      <option value="7">7 Players</option>
      <option value="8">8 Players</option>
    </select>
    
    <h4 style="margin: 15px 0 5px 0;">Enter Player Names:</h4>
    <div id="namesContainer" class="names-container"></div>

    <button class="start-btn" onclick="startGame()">Start Game 🚀</button>
  </div>

  <!-- STEP 2: GAME SCREEN -->
  <div id="game-screen">
    <h1>😈 Truth or Dare (Desi Style)</h1>
    
    <div id="turn-info">Spin the wheel! 👇</div>

    <!-- Spinner Wheel -->
    <div class="spinner-container" onclick="spinWheel()">
      <div class="arrow"></div>
      <div class="wheel" id="wheel"></div>
      <div class="center-circle">SPIN</div>
    </div>

    <button id="spinBtn" class="spin-btn" onclick="spinWheel()">SPIN WHEEL 🎡</button>

    <!-- Question Box -->
    <div class="box">
        <button id="truthBtn" class="truth" onclick="getTruth()" disabled>Truth</button>
        <button id="dareBtn" class="dare" onclick="getDare()" disabled>Dare</button>

        <div id="result">Pehle Wheel Spin Karein! 👆</div>
    </div>

    <button class="reset-btn" onclick="resetGame()">Change Players ⚙️</button>
  </div>

  <!-- Bottom-Right Winner Option -->
  <button id="winnerBtn" class="winner-btn" onclick="declareWinner()" style="display: none;">Show Winner 🏆</button>

  <!-- STEP 3: WINNER SCREEN & FIREWORKS OVERLAY -->
  <div id="winner-screen">
    <canvas id="canvas-fireworks"></canvas>
    <div class="winner-content">
        <div class="winner-title">🏆 GAME WINNER 🏆</div>
        <div id="winner-text" class="winner-details"></div>
        <div id="stats-container"></div>
        <div class="action-btn-group">
            <button class="back-btn" onclick="closeWinnerScreenToHome()">Home 🏠</button>
            <button class="start-btn" onclick="restartGameFromWinner()">Play Again 🔄</button>
        </div>
    </div>
  </div>









<!--java coding start-->
<script>
let truths = [
    "Tumhara secret crush kaun hai?",
    "Sabse embarrassing moment kya tha?",
    "Kabhi jhoot bolkar bach gaye ho?",
    "Kisi ko secretly stalk kiya hai?",
    "Last time kab roye the aur kyun?",
    "Tumne gobar khana kab chhoda?",
    "Kabi jail me gaye ho or kyu?",
    "Kabi kisi ladki se thapad khaye ho?",
    "Kabi pyaar kiya h?",
    "Kabi kisi ladki ne dokha diya h?",
    "Kabi kisi bin bulayi sadhi me gaye ho?",
    "Kabi class me potty kiya hai?",
    "Kabi dosto ke sath beth kr bear pi h?",
    "Piker kisi naale me gire ho?"
];

let dares = [
    "Ek funny dance karke dikhao 😂",
    "Apni gallery ka 5th photo dikhao",
    "Kisi friend ko 'I love you' text bhejo 😜",
    "5 push-ups karo abhi 💪",
    "Ek gaana zor se gao 🎤",
    "Samay raina ki sabse famous gaali sunao",
    "Krish ka gana sunao",
    "Apne papa ke sath baith kr bear pio",
    "Apne best friend ko gaali nikalo",
    "Bhojpuri gaane pr dance krke dikhao",
    "Kinnar ki acting krke dikhao",
    "Sbhi ko apna ak secret btao jo kbhi nhi btaya"
];

const colors = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#1dd1a1', '#ff9ff3', '#54a0ff', '#ff9f43', '#a55eea'];
let currentRotation = 0;
let totalPlayers = 6;
let playerNames = [];
let isSpinning = false;
let playerScores = {};
let fireworksInterval;

// Initialize Name Inputs on Load
window.onload = function() {
    generateNameInputs();
};

function generateNameInputs() {
    totalPlayers = parseInt(document.getElementById('playerSelect').value);
    const container = document.getElementById('namesContainer');
    container.innerHTML = '';

    for (let i = 1; i <= totalPlayers; i++) {
        const input = document.createElement('input');
        input.type = 'text';
        input.id = `playerName${i}`;
        input.placeholder = `Player ${i} Name`;
        input.value = `Player ${i}`;
        container.appendChild(input);
    }
}

// 1. Start Game
function startGame() {
    totalPlayers = parseInt(document.getElementById('playerSelect').value);
    playerNames = [];
    
    // Fetch Names
    for (let i = 1; i <= totalPlayers; i++) {
        const nameInput = document.getElementById(`playerName${i}`).value.trim();
        playerNames.push(nameInput !== '' ? nameInput : `Player ${i}`);
    }

    document.getElementById('selection-screen').style.display = 'none';
    document.getElementById('game-screen').style.display = 'flex';
    document.getElementById('winnerBtn').style.display = 'block';
    
    // Score reset
    playerScores = {};
    for (let i = 0; i < totalPlayers; i++) {
        playerScores[playerNames[i]] = 0;
    }

    createWheel();
}

// 2. Wheel Creation
function createWheel() {
    const wheel = document.getElementById('wheel');
    wheel.style.transition = 'none';
    currentRotation = 0;
    wheel.style.transform = `rotate(0deg)`;
    wheel.innerHTML = '';
    
    document.getElementById('result').innerText = "Pehle Wheel Spin Karein! 👆";
    document.getElementById('turn-info').innerText = "Spin the wheel! 👇";
    document.getElementById('truthBtn').disabled = true;
    document.getElementById('dareBtn').disabled = true;

    const segmentAngle = 360 / totalPlayers;
    let gradientStops = [];

    for (let i = 0; i < totalPlayers; i++) {
        const startAngle = i * segmentAngle;
        const endAngle = (i + 1) * segmentAngle;
        gradientStops.push(`${colors[i % colors.length]} ${startAngle}deg ${endAngle}deg`);

        const numDiv = document.createElement('div');
        numDiv.className = 'number';
        numDiv.innerText = playerNames[i];
        
        const midAngle = startAngle + (segmentAngle / 2);
        numDiv.style.transform = `rotate(${midAngle}deg) translate(0, -100px) rotate(-${midAngle}deg)`;
        wheel.appendChild(numDiv);
    }

    wheel.style.background = `conic-gradient(${gradientStops.join(', ')})`;
}

// 3. Spin Wheel Logic
function spinWheel() {
    if (isSpinning) return;
    isSpinning = true;

    const wheel = document.getElementById('wheel');
    const spinBtn = document.getElementById('spinBtn');
    const truthBtn = document.getElementById('truthBtn');
    const dareBtn = document.getElementById('dareBtn');
    const resultDiv = document.getElementById('result');
    const turnInfo = document.getElementById('turn-info');

    spinBtn.disabled = true;
    truthBtn.disabled = true;
    dareBtn.disabled = true;
    resultDiv.innerText = "Wheel Ghoom Raha Hai... 🎡";
    turnInfo.innerText = "Waiting...";

    const segmentAngle = 360 / totalPlayers;
    const winningIndex = Math.floor(Math.random() * totalPlayers);
    const targetSegmentCenter = (winningIndex * segmentAngle) + (segmentAngle / 2);
    const degreesToRotate = 360 - targetSegmentCenter;

    currentRotation += 1800 + (degreesToRotate - (currentRotation % 360));
    
    wheel.style.transition = 'transform 4s cubic-bezier(0.15, 0.85, 0.35, 1)';
    wheel.style.transform = `rotate(${currentRotation}deg)`;

    setTimeout(() => {
        const selectedPlayerName = playerNames[winningIndex];
        playerScores[selectedPlayerName]++;
        
        turnInfo.innerText = `🎯 ${selectedPlayerName} ki Baari Hai!`;
        resultDiv.innerText = `${selectedPlayerName}, Ab Truth ya Dare Chuno 👇`;
        
        spinBtn.disabled = false;
        truthBtn.disabled = false;
        dareBtn.disabled = false;
        isSpinning = false;
    }, 4000);
}

// 4. Truth & Dare Functions
function disableActionButtons() {
    document.getElementById("truthBtn").disabled = true;
    document.getElementById("dareBtn").disabled = true;
}

function getTruth() {
    let random = truths[Math.floor(Math.random() * truths.length)];
    document.getElementById("result").innerText = "👉 " + random;
    disableActionButtons();
}

function getDare() {
    let random = dares[Math.floor(Math.random() * dares.length)];
    document.getElementById("result").innerText = "👉 " + random;
    disableActionButtons();
}

// 5. Declare Winner
function declareWinner() {
    let maxTurns = -1;
    let winners = [];

    for (let player in playerScores) {
        if (playerScores[player] > maxTurns) {
            maxTurns = playerScores[player];
            winners = [player];
        } else if (playerScores[player] === maxTurns && maxTurns > 0) {
            winners.push(player);
        }
    }

    if (maxTurns <= 0) {
        alert("Abhi tak kisine wheel spin nahi kiya hai!");
        return;
    }

    const winnerText = document.getElementById('winner-text');
    const statsContainer = document.getElementById('stats-container');

    if (winners.length === 1) {
        winnerText.innerHTML = `🎉 <strong>${winners[0]}</strong> is the Winner!<br><small>Total ${maxTurns} baar spinner landing se jeeta hai!</small>`;
    } else {
        winnerText.innerHTML = `🤝 <strong>Tie between ${winners.join(' & ')}</strong>!<br><small>Donoke equal ${maxTurns} turns the!</small>`;
    }

    // Build Score Stats Table with Player Names
    let tableHTML = `<table class="stats-table"><tr><th>Player Name</th><th>Total Turns</th></tr>`;
    for (let p = 0; p < totalPlayers; p++) {
        let pName = playerNames[p];
        tableHTML += `<tr><td>${pName}</td><td>${playerScores[pName]}</td></tr>`;
    }
    tableHTML += `</table>`;
    statsContainer.innerHTML = tableHTML;

    // Show Winner Overlay and Start Fireworks
    document.getElementById('winner-screen').style.display = 'flex';
    startFireworks();
}

// BACK TO HOME SCREEN FUNCTION
function closeWinnerScreenToHome() {
    document.getElementById('winner-screen').style.display = 'none';
    stopFireworks();
    resetGame();
}

// PLAY AGAIN FUNCTION (Same Players, Fresh Round)
function restartGameFromWinner() {
    document.getElementById('winner-screen').style.display = 'none';
    stopFireworks();
    
    // Scores and Wheel Reset
    for (let i = 0; i < totalPlayers; i++) {
        playerScores[playerNames[i]] = 0;
    }
    createWheel();
}

// 6. Fireworks Effect Generator Logic
let canvas, ctx, particles = [];

function startFireworks() {
    canvas = document.getElementById('canvas-fireworks');
    ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    particles = [];
    fireworksInterval = setInterval(createFirework, 300);
    requestAnimationFrame(loopFireworks);
}

function stopFireworks() {
    clearInterval(fireworksInterval);
    particles = [];
    if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function createFirework() {
    const x = Math.random() * canvas.width;
    const y = Math.random() * (canvas.height / 2);
    const particleCount = 40;
    const color = `hsl(${Math.random() * 360}, 100%, 50%)`;

    for (let i = 0; i < particleCount; i++) {
        const angle = (Math.PI * 2 / particleCount) * i;
        const speed = Math.random() * 5 + 2;
        particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            alpha: 1,
            color: color
        });
    }
}

function loopFireworks() {
    if (document.getElementById('winner-screen').style.display !== 'flex') return;

    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.globalCompositeOperation = 'lighter';

    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.05; // Gravity
        p.alpha -= 0.015;

        if (p.alpha <= 0) {
            particles.splice(i, 1);
            continue;
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.fill();
    }

    requestAnimationFrame(loopFireworks);
}

// 7. Change Players / Reset
function resetGame() {
    if (isSpinning) return;
    document.getElementById('game-screen').style.display = 'none';
    document.getElementById('selection-screen').style.display = 'block';
    document.getElementById('winnerBtn').style.display = 'none';
}
</script>

</body>
